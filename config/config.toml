[app]
name = "wc3-team-follow"
env  = "development"

[logging]
# Console log: format and minimum level.
default = "color"
level   = "debug"
# Log file in <data folder>/logs/team-follow.log, for bug reports: JSON lines
# with source locations, rotated at file_max_mb with file_keep old files.
# Crashes are written to logs/crash.log with full stack traces.
file        = true
file_level  = "debug"
file_max_mb = 5
file_keep   = 3

[follow]
# Live joining is allowed only on game builds whose behaviour has been checked
# by hand. Other builds connect and can be monitored, but never join.
verified_builds = ["3.0.1.24371"]
# How often the companion re-reads the team and friend lists from the game.
refresh_interval = "5s"
# How long to wait between attempts to find a running game client.
discovery_interval = "10s"

[storage]
# Folder under the per-user data directory (%LOCALAPPDATA% on Windows,
# ~/Library/Application Support on macOS, $XDG_CONFIG_HOME on Linux).
# WF_DATA_DIR overrides the whole path, e.g. for isolated tests.
dir_name = "WarcraftTeamFollow"

[window]
title      = "Warcraft Team Follow"
width      = 1040
height     = 760
min_width  = 720
min_height = 560

[updates]
# Team Follow checks GitHub Releases for a newer stable version and asks
# before anything changes. Only GitHub's own hosts are contacted, over HTTPS.
api_url        = "https://api.github.com"
repository     = "mihaiflorentin/wc3-team-follow"
check_interval = "6h"
retry_interval = "30m"
timeout        = "20s"

[maps]
# Keep maps up to date (docs/adr/0012): Team Follow checks each tracked map's
# GitHub Releases and downloads the newest version into the Maps folder when
# it's missing, checked against the SHA-256 GitHub publishes. Only GitHub's own
# hosts are contacted, over HTTPS. Old versions are never deleted or replaced.
api_url        = "https://api.github.com"
check_interval = "6h"
retry_interval = "30m"
timeout        = "20s"
# Largest map file downloaded, in MB.
max_size_mb = 256

# Each tracked map: its name in the window, the GitHub repository that
# publishes official releases, a pattern the whole file name must match with a
# group named version, and the Maps subfolder downloads go into. Download for
# play only; Team Follow never redistributes a map.
[[maps.tracked]]
name       = "Legion TD"
repository = "team-oze/Legion-TD"
pattern    = '(?i)^Legion_TD_(?P<version>\d[^_/\\ ]*)_Team_?OZE(?: \(\d+\))?\.w3x$'
folder     = "Download"

[leavers]
# Blacklist players who leave Legion TD early (docs/adr/0013), off until the
# player switches it on in the Blacklist tab. After each match Team Follow
# reads the game's own LastReplay.w3g: anyone who left before the final round
# (or before the first -draw or -ff vote that ended the match) is added.
# map is the tracked map, by its name in [[maps.tracked]], whose matches count.
map = "Legion TD"
# The final round is the round the match ended in, read from the replay.
# final_round is used only for a replay that shows no rounds: the last part
# of the match nobody is judged in (Legion TD rounds take about 2 to 6
# minutes).
final_round = "4m"
