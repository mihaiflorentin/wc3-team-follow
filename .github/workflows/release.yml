name: release

# Builds Warcraft Team Follow for Windows (amd64), Linux (amd64) and macOS
# (arm64) and publishes the files as a GitHub Release.
#
# - A pushed Release Tag (X.Y.Z, optional leading v and pre-release part)
#   publishes a release named after the tag. scripts/release-tag.sh
#   classifies the tag; tags it rejects run nothing. The notes are the
#   tag's CHANGELOG.md section (scripts/releasenotes); a tag without one
#   fails before anything is built.
# - A push to master replaces the rolling "edge" pre-release, so the latest
#   master build is always downloadable. Its notes are [Unreleased].
#
# The window needs cgo on macOS and Linux, so each of those builds runs on
# its own OS; Windows cross-compiles from Linux. Tests run on all three.
# Any failing job stops the release. See docs/ci.md.
on:
  push:
    branches:
      - master
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.kind.outputs.release }}
      prerelease: ${{ steps.kind.outputs.prerelease }}
      tag: ${{ steps.kind.outputs.tag }}
      version: ${{ steps.kind.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Classify the push
        id: kind
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            sh scripts/release-tag.sh "$REF_NAME" | grep -E '^(release|prerelease)=' >> "$GITHUB_OUTPUT"
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tag=edge" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-edge.${SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      # The release notes are the tag's CHANGELOG.md section (edge: the
      # [Unreleased] one). A tag without a section stops the release here,
      # before anything is built.
      - uses: actions/setup-go@v6
        if: steps.kind.outputs.release == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Release notes from CHANGELOG.md
        if: steps.kind.outputs.release == 'true'
        env:
          TAG: ${{ steps.kind.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p notes
          if ! go run ./scripts/releasenotes -tag "$TAG" -repo "$REPO" -head "${SHA::7}" > notes/notes.md; then
            echo "::error file=CHANGELOG.md::No release notes for $TAG. CHANGELOG.md needs a section for this version; see docs/ci.md."
            exit 1
          fi
          cat notes/notes.md
      - uses: actions/upload-artifact@v4
        if: steps.kind.outputs.release == 'true'
        with:
          name: notes
          path: notes/notes.md
          if-no-files-found: error

  test:
    needs: classify
    if: needs.classify.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        runner: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    needs: [classify, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-amd64
            runner: ubuntu-latest
            target: package-windows-amd64
            file: dist/wc3-team-follow-windows-amd64.zip
          - name: linux-amd64
            # The oldest supported Ubuntu keeps the glibc requirement low.
            runner: ubuntu-22.04
            target: package-linux-amd64
            file: dist/wc3-team-follow-linux-amd64.tar.gz
          - name: macos-arm64
            runner: macos-latest
            target: package-darwin-arm64
            file: dist/wc3-team-follow-macos-arm64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install WebKitGTK
        if: matrix.name == 'linux-amd64'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        env:
          VERSION: ${{ needs.classify.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: make ${{ matrix.target }} VERSION="$VERSION" COMMIT="${COMMIT::7}" DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  release:
    needs: [classify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes
      - name: Checksums
        working-directory: dist
        run: sha256sum wc3-team-follow-* > checksums.txt && cat checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.classify.outputs.tag }}
          PRERELEASE: ${{ needs.classify.outputs.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$TAG" = "edge" ]; then
            gh release delete edge --cleanup-tag --yes || true
            gh release create edge dist/wc3-team-follow-* dist/checksums.txt \
              --target "$SHA" --prerelease --title "Edge build (master ${SHA::7})" \
              --notes-file notes/notes.md
          else
            prerelease=""
            if [ "$PRERELEASE" = "true" ]; then prerelease="--prerelease"; fi
            gh release create "$TAG" dist/wc3-team-follow-* dist/checksums.txt \
              --title "$TAG" --notes-file notes/notes.md --verify-tag $prerelease
          fi
